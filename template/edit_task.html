{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'add_task.css' %}">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="add_task_bar">
        <h1>Edit Task</h1>
        <form action="{% url 'edit_task' task.id %}" method="post">
            {% csrf_token %}
            <label for="title">Title:</label><br>
            <input id="title" type="text" name="title" value="{{ task.title }}" maxlength="30" required><br><br>
            <label for="description">Description:</label><br>
            <input id="description" type="text" name="description" value="{{ task.description }}" maxlength="30" required><br><br>
            <div class="btn-box">
                <button class="save" type="submit">Save</button>
                <a class="cancel" href="{% url 'home' %}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
